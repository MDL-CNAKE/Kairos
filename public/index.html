<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <style>
    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:        #0c0c0c;
      --surface:   #141414;
      --surface2:  #1e1e1e;
      --border:    #2a2a2a;
      --accent:    #f0a500;
      --accent-h:  #fbbf24;
      --text:      #f0ede8;
      --muted:     #666;
      --todo:      #444;
      --progress:  #d97706;
      --done:      #16a34a;
      --low:       #3a3a3a;
      --medium:    #d97706;
      --high:      #dc2626;
      --danger:    #ef4444;
      --radius:    5px;
    }
    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Utility ── */
    .hidden { display: none !important; }
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 3px; font-size: 10px;
      font-weight: 700; text-transform: uppercase; letter-spacing: .6px;
    }
    .badge-todo     { background: #1e1e1e; color: #555; border: 1px solid #333; }
    .badge-progress { background: #2a1f00; color: var(--accent); border: 1px solid #3d2d00; }
    .badge-done     { background: #0a1f0e; color: #4ade80; border: 1px solid #164c27; }
    .badge-low      { background: #1e1e1e; color: #555; border: 1px solid #333; }
    .badge-medium   { background: #2a1f00; color: var(--accent); border: 1px solid #3d2d00; }
    .badge-high     { background: #2a0a0a; color: #f87171; border: 1px solid #4a1515; }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: var(--radius); border: none; cursor: pointer;
      font-size: 13px; font-weight: 500; transition: background .15s, color .15s, opacity .15s;
      font-family: inherit;
    }
    .btn-primary  { background: var(--accent); color: #000; font-weight: 700; }
    .btn-primary:hover { background: var(--accent-h); }
    .btn-ghost    { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { color: var(--text); border-color: #444; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    input, textarea {
      background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--text); padding: 9px 12px; font-size: 14px; width: 100%; outline: none;
      transition: border-color .15s; font-family: inherit;
    }
    input:focus, textarea:focus { border-color: var(--accent); }
    input::placeholder { color: #3a3a3a; }
    .error-msg { color: var(--danger); font-size: 12px; margin-top: 6px; min-height: 18px; }
    .avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: #2a1f00; color: var(--accent); border: 1px solid #3d2d00;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 800; flex-shrink: 0;
    }

    /* ── Toast ── */
    #toast-container {
      position: fixed; bottom: 20px; right: 20px;
      display: flex; flex-direction: column; gap: 8px; z-index: 9999;
    }
    .toast {
      background: var(--surface); border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      padding: 10px 16px; border-radius: var(--radius);
      font-size: 13px; max-width: 300px; color: var(--text);
      animation: slideIn .2s ease;
    }
    @keyframes slideIn { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }

    /* ── LOGIN ── */
    #view-login {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; background: var(--bg);
    }
    .login-wrap { width: 380px; }
    .login-logo {
      font-size: 26px; font-weight: 800; letter-spacing: -1px; margin-bottom: 2px;
    }
    .login-logo span { color: var(--accent); }
    .login-tagline { color: var(--muted); margin-bottom: 36px; font-size: 13px; }
    .login-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 32px;
    }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block; margin-bottom: 6px; font-size: 11px; font-weight: 600;
      color: var(--muted); text-transform: uppercase; letter-spacing: .6px;
    }
    .login-card .btn-primary {
      width: 100%; justify-content: center; padding: 11px; font-size: 14px; margin-top: 6px;
    }
    .login-divider {
      height: 1px; background: var(--border); margin: 28px 0 20px;
    }
    .login-hint { font-size: 12px; color: var(--muted); line-height: 1.6; }
    .login-hint code {
      background: var(--surface2); border: 1px solid var(--border);
      padding: 1px 5px; border-radius: 3px; font-size: 11px; color: var(--accent);
    }

    /* ── NAVBAR ── */
    #navbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      background: var(--bg); border-bottom: 1px solid var(--border);
      padding: 0 24px; height: 52px;
    }
    .nav-logo {
      font-size: 16px; font-weight: 800; letter-spacing: -.5px; cursor: pointer;
      display: flex; align-items: center; gap: 2px;
    }
    .nav-logo span { color: var(--accent); }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .nav-user  { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }

    /* ── DASHBOARD ── */
    #view-dashboard { padding: 36px 28px; }
    .dash-header { margin-bottom: 28px; }
    .dash-title { font-size: 22px; font-weight: 800; margin-bottom: 4px; letter-spacing: -.5px; }
    .dash-sub   { color: var(--muted); font-size: 13px; }
    .projects-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px;
    }
    .project-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 20px; cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .project-card:hover { border-color: var(--accent); background: #181818; }
    .project-card-title {
      font-weight: 700; font-size: 15px; margin-bottom: 6px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .project-card-desc {
      color: var(--muted); font-size: 12px; line-height: 1.6; min-height: 36px;
      overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .project-card-footer {
      display: flex; align-items: center; justify-content: space-between; margin-top: 16px;
      padding-top: 14px; border-top: 1px solid var(--border);
    }
    .project-cat {
      font-size: 10px; color: var(--accent); font-weight: 700; text-transform: uppercase;
      letter-spacing: .6px;
    }
    .project-members { display: flex; gap: 4px; }
    .empty-state { color: var(--muted); text-align: center; padding: 60px 20px; }
    .empty-state-icon { font-size: 36px; margin-bottom: 12px; }

    /* ── PROJECT VIEW ── */
    #view-project { display: flex; flex-direction: column; height: calc(100vh - 52px); overflow: hidden; }
    .project-header {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 20px; border-bottom: 1px solid var(--border);
      background: var(--bg); flex-shrink: 0;
    }
    .project-header-title { font-weight: 700; font-size: 15px; }
    .project-body { display: flex; flex: 1; overflow: hidden; }

    /* ── KANBAN ── */
    #kanban-area {
      flex: 1; display: flex; overflow-x: auto;
      padding: 20px; gap: 14px; background: var(--bg);
    }
    .kanban-col {
      flex: 1; min-width: 240px; max-width: 320px;
      display: flex; flex-direction: column;
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      overflow: hidden;
    }
    .kanban-col.drag-over { border-color: var(--accent); }
    .col-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .col-title { font-weight: 700; font-size: 12px; display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); }
    .col-dot { width: 7px; height: 7px; border-radius: 50%; }
    .col-dot-todo     { background: #444; }
    .col-dot-progress { background: var(--accent); }
    .col-dot-done     { background: #22c55e; }
    .col-count {
      background: var(--surface2); color: var(--muted);
      border-radius: 3px; padding: 1px 6px; font-size: 11px; font-weight: 700;
    }
    .col-cards { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .col-cards:empty::after {
      content: 'Nessun task'; color: #333; font-size: 12px;
      text-align: center; padding: 24px 0; display: block;
    }

    /* ── TASK CARD ── */
    .task-card {
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      padding: 12px; cursor: grab; transition: border-color .1s, opacity .1s;
      user-select: none;
    }
    .task-card:hover { border-color: #3a3a3a; }
    .task-card.dragging { opacity: .3; cursor: grabbing; }
    .task-title { font-weight: 500; font-size: 13px; line-height: 1.5; margin-bottom: 10px; }
    .task-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .task-assignee {
      display: flex; align-items: center; gap: 5px;
      color: var(--muted); font-size: 11px; margin-left: auto;
    }
    .task-deadline { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 3px; }

    /* ── CHAT ── */
    #chat-panel {
      width: 290px; flex-shrink: 0;
      display: flex; flex-direction: column;
      border-left: 1px solid var(--border);
      background: var(--surface);
    }
    .chat-header {
      padding: 14px 16px; border-bottom: 1px solid var(--border);
      font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
      color: var(--muted); display: flex; align-items: center; gap: 8px;
    }
    .chat-live-dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    #chat-messages {
      flex: 1; overflow-y: auto; padding: 12px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .msg { display: flex; gap: 8px; align-items: flex-start; }
    .msg-bubble { background: var(--surface2); border-radius: 6px; padding: 8px 10px; flex: 1; }
    .msg-sender { font-size: 11px; font-weight: 700; color: var(--accent); margin-bottom: 3px; }
    .msg-text   { font-size: 13px; line-height: 1.5; color: var(--text); word-break: break-word; }
    .msg-time   { font-size: 10px; color: #3a3a3a; margin-top: 4px; }
    .msg.mine .msg-bubble { background: #1e1a0e; border: 1px solid #2a2200; }
    .msg.mine .msg-sender { color: var(--accent-h); }
    .chat-footer { padding: 10px 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
    .chat-footer input { flex: 1; }
    .chat-footer .btn { flex-shrink: 0; }

    /* ── Modale ── */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; width: 100%; max-width: 440px; padding: 22px; }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
    .modal select { width: 100%; background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 10px; font: inherit; font-size: 13px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .dash-header .btn, .project-header .btn-new-task { margin-top: 10px; }
    /* ── Notifiche ── */
    .bell { position: relative; background: transparent; border: 1px solid var(--border); color: var(--text); border-radius: var(--radius); width: 32px; height: 32px; cursor: pointer; font-size: 15px; }
    .bell:hover { border-color: #444; }
    .bell-count { position: absolute; top: -6px; right: -6px; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; border-radius: 9px; min-width: 17px; height: 17px; line-height: 17px; padding: 0 4px; }
    .notif-panel { position: fixed; top: 56px; right: 16px; width: 320px; max-width: calc(100vw - 32px); max-height: 60vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; z-index: 40; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
    .notif-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--border); font-weight: 700; font-size: 13px; }
    .notif-item { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 12px; line-height: 1.5; cursor: pointer; }
    .notif-item.unread { background: #1e1a0e; }
    .notif-item small { display: block; color: var(--muted); font-size: 10px; margin-top: 3px; }
    .notif-empty { padding: 18px; text-align: center; color: var(--muted); font-size: 12px; }

    /* ── Toolbar ricerca e filtri ── */
    .board-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--surface); }
    .search-box { position: relative; flex: 1 1 220px; max-width: 340px; }
    .search-box input { width: 100%; padding-left: 30px; }
    .search-box::before { content: '⌕'; position: absolute; left: 10px; top: 50%; transform: translateY(-52%); color: var(--muted); font-size: 15px; pointer-events: none; }
    .board-toolbar select, .col-sort { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 8px; font: inherit; font-size: 12px; cursor: pointer; }
    .board-toolbar select:focus, .col-sort:focus { outline: none; border-color: var(--accent); }
    .filter-info { font-size: 12px; color: var(--muted); }
    .col-sort { padding: 3px 4px; font-size: 11px; margin-left: auto; margin-right: 8px; max-width: 110px; }
    /* ── Card task ── */
    .task-card { position: relative; border-left: 3px solid transparent; cursor: grab; transition: border-color .15s, transform .15s, box-shadow .15s; }
    .task-card:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,.35); }
    .task-card.prio-high   { border-left-color: #dc2626; }
    .task-card.prio-medium { border-left-color: #d97706; }
    .task-card.prio-low    { border-left-color: #3a3a3a; }
    .task-card.is-overdue  { background: #1f1010; }
    .task-meta-spacer { flex: 1; }
    .task-avatar { width: 24px; height: 24px; font-size: 10px; color: #000; font-weight: 800; flex-shrink: 0; }
    .task-avatar.unassigned { background: transparent !important; color: var(--muted); border: 1px dashed #444; }
    .task-deadline.soon    { color: var(--accent); }
    .task-deadline.overdue { color: #f87171; font-weight: 700; }
    /* ── Drag & drop ── */
    .card-ghost  { opacity: .35; border: 1px dashed var(--accent) !important; background: transparent !important; }
    .card-chosen { box-shadow: 0 0 0 1px var(--accent); }
    .card-drag   { transform: rotate(2.5deg) scale(1.03); box-shadow: 0 14px 30px rgba(0,0,0,.6) !important; cursor: grabbing; opacity: 1 !important; }
    #kanban-area.is-dragging .kanban-col { border-style: dashed; }
    #kanban-area.is-dragging .col-cards { min-height: 80px; }
    .kanban-col.drag-over { border-color: var(--accent); }
    /* ── Errori nei form ── */
    .form-group.has-error input, .form-group.has-error textarea, .form-group.has-error select { border-color: var(--danger) !important; }
    .field-msg { color: var(--danger); font-size: 11px; margin-top: 4px; }
    .form-group label .req { color: var(--danger); }

    /* ── Fase 2: extra sulle card ── */
    .card-extra { display: flex; flex-direction: column; gap: 6px; margin: -4px 0 10px; }
    .card-extra-row { display: flex; gap: 8px; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 4px; }
    .tag-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 20px; border: 1px solid; line-height: 16px; }
    .tag-more { background: var(--surface2); color: var(--muted); border-color: var(--border); }
    .card-progress { display: flex; align-items: center; gap: 8px; }
    .card-progress-bar { flex: 1; height: 4px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
    .card-progress-bar span { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .3s; }
    .card-progress-label { font-size: 10px; color: var(--muted); white-space: nowrap; }
    .card-progress-label.complete { color: #4ade80; }
    .card-comments { font-size: 10px; color: var(--muted); }
    .task-card { cursor: pointer; }
    /* ── Pannello dettaglio ── */
    .drawer-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 45; display: flex; justify-content: flex-end; }
    .drawer { width: 460px; max-width: 100vw; height: 100%; background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; animation: drawerIn .22s ease-out; }
    @keyframes drawerIn { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
    .drawer-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
    .drawer-meta { font-size: 11px; color: var(--muted); flex: 1; }
    .drawer-body { flex: 1; overflow-y: auto; padding: 18px; }
    .drawer-actions { display: flex; justify-content: space-between; gap: 8px; }
    .drawer-section { border-top: 1px solid var(--border); margin-top: 18px; padding-top: 16px; }
    .drawer-section h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); margin-bottom: 10px; display: flex; gap: 8px; align-items: baseline; }
    .section-note { text-transform: none; letter-spacing: 0; font-weight: 500; }
    .form-row-3 { grid-template-columns: 1fr 1fr 1fr; }
    .drawer select { width: 100%; background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 8px; font: inherit; font-size: 13px; }
    .icon-btn { background: transparent; border: none; color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer; padding: 0 4px; }
    .icon-btn:hover { color: var(--text); }
    .drawer-close { margin-left: auto; font-size: 22px; }
    .btn-danger { color: #f87171; border-color: #4a1515; }
    .btn-danger:hover { color: #fff; background: #7f1d1d; border-color: #7f1d1d; }
    .muted-note { font-size: 12px; color: var(--muted); }
    .tag-chip-lg { font-size: 12px; padding: 3px 4px 3px 10px; }
    .tag-x { background: transparent; border: none; color: inherit; cursor: pointer; font-size: 14px; line-height: 1; padding: 0 3px; opacity: .7; }
    .tag-x:hover { opacity: 1; }
    .tag-add { display: flex; gap: 8px; margin-top: 10px; }
    .tag-add input { flex: 1; }
    .tag-preset { cursor: pointer; font-size: 11px; padding: 2px 9px; background: transparent; }
    .color-row { display: flex; align-items: center; gap: 6px; margin: 10px 0 8px; flex-wrap: wrap; }
    .color-dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
    .color-dot.active { border-color: #fff; box-shadow: 0 0 0 2px var(--surface); }
    .color-custom { position: relative; cursor: pointer; font-size: 14px; }
    .color-custom input { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; padding: 0; }
    .progress { height: 6px; background: var(--surface2); border-radius: 6px; overflow: hidden; margin-bottom: 10px; }
    .progress span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
    .progress span.complete { background: #22c55e; }
    .checklist { list-style: none; display: flex; flex-direction: column; gap: 2px; }
    .check-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 6px; border-radius: var(--radius); }
    .check-item:hover { background: var(--surface2); }
    .check-item label { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; flex: 1; }
    .check-item input { width: 15px; height: 15px; accent-color: var(--accent); }
    .check-item.done span { text-decoration: line-through; color: var(--muted); }
    .comments { display: flex; flex-direction: column; gap: 10px; max-height: 260px; overflow-y: auto; margin-bottom: 10px; }
    .comment { display: flex; gap: 8px; }
    .comment-body { flex: 1; background: var(--surface2); border-radius: 6px; padding: 7px 10px; }
    .comment.mine .comment-body { background: #1e1a0e; border: 1px solid #2a2200; }
    .comment-head { display: flex; align-items: center; gap: 8px; font-size: 11px; }
    .comment-head span { color: var(--muted); flex: 1; }
    .comment-text { font-size: 13px; line-height: 1.5; margin-top: 3px; white-space: pre-wrap; word-break: break-word; }
    .comment-actions { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-top: 6px; }
    #td-comment-input { width: 100%; resize: vertical; }
    @media (max-width: 560px) { .form-row-3 { grid-template-columns: 1fr; } .drawer { width: 100vw; } }

    /* ── Spinner ── */
    .spinner {
      display: inline-block; width: 18px; height: 18px; border: 2px solid #222;
      border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a3a3a; }
  </style>
</head>

<!-- ═══════════ SCRIPT ═══════════ -->
<script>
/* ────────────────────────── STATE ────────────────────────── */
const st = {
  token:   null,
  user:    null,
  project: null,
  socket:  null,
};

/* ────────────────────────── API ────────────────────────── */
async function api(method, path, body) {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json' },
  };
  if (st.token) opts.headers['Authorization'] = `Bearer ${st.token}`;
  if (body)     opts.body = JSON.stringify(body);
  const res = await fetch(`/api${path}`, opts);
  if (res.status === 204) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.message || `Errore ${res.status}`);
  return data;
}

/* ────────────────────────── VIEWS ────────────────────────── */
function showView(id) {
  ['view-login','view-dashboard','view-project'].forEach(v => {
    document.getElementById(v).classList.toggle('hidden', v !== id);
  });
  document.getElementById('navbar').classList.toggle('hidden', id === 'view-login');
}

/* ────────────────────────── TOAST ────────────────────────── */
function toast(msg, duration = 3000) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), duration);
}

/* ────────────────────────── LOGIN ────────────────────────── */
async function doLogin() {
  const email    = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl    = document.getElementById('login-error');
  const btn      = document.getElementById('login-btn');
  errEl.textContent = '';
  if (!email || !password) { errEl.textContent = 'Compila tutti i campi.'; return; }
  btn.innerHTML = '<span class="spinner"></span>';
  btn.disabled  = true;
  try {
    const data = await api('POST', '/auth/login', { email, password });
    st.token = data.accessToken;
    st.user  = data.user;
    document.getElementById('nav-username').textContent = st.user.username;
    document.getElementById('nav-avatar').textContent   = st.user.username[0].toUpperCase();
    initSocket();
    await goToDashboard();
  } catch (e) {
    errEl.textContent = e.message;
  } finally {
    btn.textContent = 'Accedi';
    btn.disabled    = false;
  }
}

document.getElementById('login-password').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

/* ────────────────────────── LOGOUT ────────────────────────── */
function logout() {
  if (st.socket) { st.socket.disconnect(); st.socket = null; }
  st.token = st.user = st.project = null;
  showView('view-login');
  document.getElementById('login-email').value    = '';
  document.getElementById('login-password').value = '';
}

/* ────────────────────────── DASHBOARD ────────────────────────── */
async function goToDashboard() {
  loadNotifications();
  if (st.detail && st.detail.taskId) closeTaskDetail();
  showView('view-dashboard');
  document.getElementById('dash-sub').textContent   = 'Caricamento…';
  document.getElementById('projects-grid').innerHTML = '<div class="empty-state"><div class="spinner"></div></div>';
  try {
    const data  = await api('GET', '/projects/dashboard');
    const projects = [...(data.created || []), ...(data.member || [])];
    const grid  = document.getElementById('projects-grid');
    document.getElementById('dash-sub').textContent =
      `${projects.length} ${projects.length === 1 ? 'progetto' : 'progetti'}`;
    if (!projects.length) {
      grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📂</div><div>Nessun progetto ancora.</div></div>';
      return;
    }
    grid.innerHTML = projects.map(p => `
      <div class="project-card" onclick="openProject(${JSON.stringify(p).replace(/"/g,'&quot;')})">
        <div class="project-card-title">${esc(p.title)}</div>
        <div class="project-card-desc">${esc(p.description || '—')}</div>
        <div class="project-card-footer">
          <span class="project-cat">${esc(p.category)}</span>
          <div class="project-members">
            ${(p.members || []).slice(0,4).map(m => { const u = m.user?.username || m.userId?.username || '?'; return `<div class="avatar" title="${esc(u)}">${u[0].toUpperCase()}</div>`; }).join('')}
          </div>
        </div>
      </div>
    `).join('');
  } catch (e) {
    document.getElementById('projects-grid').innerHTML = `<div class="empty-state" style="color:var(--danger)">${esc(e.message)}</div>`;
  }
}

/* ────────────────────────── PROJECT ────────────────────────── */
async function openProject(project) {
  st.project = project;
  showView('view-project');
  document.getElementById('proj-title').textContent = project.title;
  const badge = document.getElementById('proj-cat-badge');
  badge.textContent = project.category;
  badge.className   = 'badge badge-todo';

  // Join socket room
  if (st.socket) st.socket.emit('project:join', { projectId: project._id });

  await Promise.all([ loadBoard(), loadMessages() ]);
}

/* ────────────────────────── KANBAN ────────────────────────── */
const STATUSES = ['todo', 'in_progress', 'done'];
const PRIORITY_RANK = { high: 3, medium: 2, low: 1 };
const PRIORITY_LABEL = { low: 'Bassa', medium: 'Media', high: 'Alta' };

st.board = { todo: [], in_progress: [], done: [] };
st.filters = { q: '', priority: '', assignee: '' };
st.sort = { todo: 'default', in_progress: 'default', done: 'default' };
st.sortables = [];

async function loadBoard({ silent = false } = {}) {
  if (!silent) {
    STATUSES.forEach(s => {
      document.getElementById(`cards-${s}`).innerHTML = '<div class="spinner" style="margin:auto;display:block"></div>';
    });
  }
  try {
    const data = await api('GET', `/projects/${st.project._id}/tasks/board`);
    const board = data.board || data;
    STATUSES.forEach(s => { st.board[s] = board[s] || []; });
    fillAssigneeFilter();
    renderBoard();
  } catch (e) {
    toast('Errore caricamento board: ' + e.message);
  }
}

/* Aggiornamento leggero quando arrivano eventi socket da altri utenti */
let boardRefreshTimer = null;
function scheduleBoardRefresh() {
  if (!st.project) return;
  clearTimeout(boardRefreshTimer);
  boardRefreshTimer = setTimeout(() => loadBoard({ silent: true }), 300);
}

function userIdOf(u) {
  if (!u) return '';
  return typeof u === 'string' ? u : (u._id || u.id || '');
}

function projectPeople() {
  const people = new Map();
  ((st.project && st.project.members) || []).forEach(m => {
    const u = m.user || m.userId;
    const id = userIdOf(u);
    if (id) people.set(String(id), (u && u.username) || id);
  });
  STATUSES.forEach(s => st.board[s].forEach(t => {
    const id = userIdOf(t.assigneeId);
    if (id && t.assigneeId.username) people.set(String(id), t.assigneeId.username);
  }));
  return people;
}

function fillAssigneeFilter() {
  const sel = document.getElementById('filter-assignee');
  const current = sel.value;
  const options = [...projectPeople()].sort((a, b) => a[1].localeCompare(b[1]));
  sel.innerHTML = '<option value="">Tutti gli assegnatari</option><option value="__none">Non assegnati</option>' +
    options.map(([id, name]) => `<option value="${esc(id)}">${esc(name)}</option>`).join('');
  sel.value = [...sel.options].some(o => o.value === current) ? current : '';
}

function matchesFilters(t) {
  const f = st.filters;
  if (f.q) {
    const q = f.q.toLowerCase();
    const inTitle = (t.title || '').toLowerCase().includes(q);
    const inDesc = (t.description || '').toLowerCase().includes(q);
    const inTags = (t.tags || []).some(tg => tg.name.toLowerCase().includes(q));
    if (!inTitle && !inDesc && !inTags) return false;
  }
  if (f.priority && t.priority !== f.priority) return false;
  if (f.assignee) {
    const id = String(userIdOf(t.assigneeId) || '');
    if (f.assignee === '__none' ? id : id !== f.assignee) return false;
  }
  return true;
}

function sortTasks(tasks, mode) {
  const list = [...tasks];
  const time = d => (d ? new Date(d).getTime() : Infinity);
  switch (mode) {
    case 'deadline':  return list.sort((a, b) => time(a.deadline) - time(b.deadline));
    case 'priority':  return list.sort((a, b) => (PRIORITY_RANK[b.priority] || 0) - (PRIORITY_RANK[a.priority] || 0));
    case 'title':     return list.sort((a, b) => (a.title || '').localeCompare(b.title || '', 'it'));
    case 'recent':    return list.sort((a, b) => time(b.createdAt) - time(a.createdAt));
    default:          return list;
  }
}

function renderBoard() {
  let visible = 0, total = 0;
  STATUSES.forEach(s => {
    const all = st.board[s];
    const shown = sortTasks(all.filter(matchesFilters), st.sort[s]);
    total += all.length;
    visible += shown.length;
    document.getElementById(`count-${s}`).textContent =
      shown.length === all.length ? all.length : `${shown.length}/${all.length}`;
    document.getElementById(`cards-${s}`).innerHTML = shown.map(taskCard).join('');
  });
  const active = st.filters.q || st.filters.priority || st.filters.assignee;
  const info = document.getElementById('filter-info');
  info.textContent = active ? `${visible} di ${total} task` : '';
  document.getElementById('filter-reset').classList.toggle('hidden', !active);
  setupDragAndDrop();
}

function applyFilters() {
  st.filters.q = document.getElementById('filter-q').value.trim();
  st.filters.priority = document.getElementById('filter-priority').value;
  st.filters.assignee = document.getElementById('filter-assignee').value;
  renderBoard();
}

function resetFilters() {
  document.getElementById('filter-q').value = '';
  document.getElementById('filter-priority').value = '';
  document.getElementById('filter-assignee').value = '';
  applyFilters();
}

function changeSort(status, mode) {
  st.sort[status] = mode;
  renderBoard();
}

/* ── Card ── */
function avatarColor(name) {
  const palette = ['#f0a500', '#3b82f6', '#22c55e', '#a855f7', '#ef4444', '#14b8a6', '#ec4899', '#f97316'];
  let h = 0;
  for (const c of String(name)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return palette[h % palette.length];
}

function deadlineInfo(t) {
  if (!t.deadline) return null;
  const d = new Date(t.deadline);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const day = new Date(d); day.setHours(0, 0, 0, 0);
  const diff = Math.round((day - today) / 86400000);
  const label = d.toLocaleDateString('it-IT', { day: '2-digit', month: 'short' });
  if (t.status === 'done') return { cls: '', label, title: 'Scadenza' };
  if (diff < 0)   return { cls: 'overdue', label, title: `Scaduto da ${-diff} ${-diff === 1 ? 'giorno' : 'giorni'}` };
  if (diff === 0) return { cls: 'soon', label: 'Oggi', title: 'Scade oggi' };
  if (diff <= 2)  return { cls: 'soon', label, title: `Scade tra ${diff} ${diff === 1 ? 'giorno' : 'giorni'}` };
  return { cls: '', label, title: 'Scadenza' };
}

function taskCard(t) {
  const name = t.assigneeId && t.assigneeId.username;
  const assigneeHtml = name
    ? `<div class="avatar task-avatar" title="Assegnato a ${esc(name)}" style="background:${avatarColor(name)}">${esc(name[0].toUpperCase())}</div>`
    : '<div class="avatar task-avatar unassigned" title="Non assegnato">?</div>';
  const dl = deadlineInfo(t);
  const deadlineHtml = dl
    ? `<span class="task-deadline ${dl.cls}" title="${esc(dl.title)}">${dl.cls === 'overdue' ? '⚠' : '📅'} ${esc(dl.label)}</span>`
    : '';
  const prio = t.priority || 'medium';
  const extra = typeof taskCardExtra === 'function' ? taskCardExtra(t) : '';
  return `<div class="task-card prio-${prio}${dl && dl.cls === 'overdue' ? ' is-overdue' : ''}" data-id="${esc(t._id)}"
      onclick="onTaskCardClick(event,'${esc(t._id)}')">
    <div class="task-title">${esc(t.title)}</div>
    ${extra}
    <div class="task-meta">
      <span class="badge badge-${prio}">${PRIORITY_LABEL[prio] || prio}</span>
      ${deadlineHtml}
      <span class="task-meta-spacer"></span>
      ${assigneeHtml}
    </div>
  </div>`;
}

function onTaskCardClick(e, id) {
  if (st.justDragged) return;
  if (typeof openTaskDetail === 'function') openTaskDetail(id);
}

function findTask(id) {
  for (const s of STATUSES) {
    const t = st.board[s].find(x => String(x._id) === String(id));
    if (t) return t;
  }
  return null;
}

/* ── Drag & drop ── */
async function moveTask(taskId, newStatus) {
  const task = findTask(taskId);
  if (!task || task.status === newStatus) { renderBoard(); return; }
  const oldStatus = task.status;
  // Aggiornamento ottimistico: la card resta dove l'hai lasciata
  st.board[oldStatus] = st.board[oldStatus].filter(t => t !== task);
  task.status = newStatus;
  st.board[newStatus].push(task);
  renderBoard();
  try {
    await api('PATCH', `/projects/${st.project._id}/tasks/${taskId}/status`, { status: newStatus });
    toast(`Task spostato in ${labelFor(newStatus)}`);
  } catch (err) {
    st.board[newStatus] = st.board[newStatus].filter(t => t !== task);
    task.status = oldStatus;
    st.board[oldStatus].push(task);
    renderBoard();
    toast('Spostamento non riuscito: ' + err.message);
  }
}

function setupDragAndDrop() {
  if (window.Sortable) {
    if (st.sortables.length) return; // le liste esistono già, Sortable osserva il DOM
    STATUSES.forEach(s => {
      st.sortables.push(Sortable.create(document.getElementById(`cards-${s}`), {
        group: 'kanban',
        sort: false,
        animation: 180,
        easing: 'cubic-bezier(.2,.8,.2,1)',
        ghostClass: 'card-ghost',
        chosenClass: 'card-chosen',
        dragClass: 'card-drag',
        forceFallback: true,
        fallbackOnBody: true,
        onStart: () => {
          st.justDragged = true;
          document.getElementById('kanban-area').classList.add('is-dragging');
        },
        onEnd: (evt) => {
          document.getElementById('kanban-area').classList.remove('is-dragging');
          setTimeout(() => { st.justDragged = false; }, 50);
          const to = evt.to.id.replace('cards-', '');
          if (evt.from !== evt.to) moveTask(evt.item.dataset.id, to);
        },
      }));
    });
    return;
  }
  // Ripiego: drag & drop nativo HTML5
  document.querySelectorAll('.task-card').forEach(card => {
    card.draggable = true;
    card.ondragstart = (e) => { e.dataTransfer.setData('text/plain', card.dataset.id); card.classList.add('dragging'); };
    card.ondragend = () => card.classList.remove('dragging');
  });
  if (st.nativeDnd) return;
  st.nativeDnd = true;
  STATUSES.forEach(s => {
    const col = document.getElementById(`col-${s}`);
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
    col.addEventListener('drop', e => {
      e.preventDefault();
      col.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      if (id) moveTask(id, s);
    });
  });
}

function labelFor(s) { return { todo:'To Do', in_progress:'In Progress', done:'Done' }[s] || s; }

/* ────────────────────────── CHAT ────────────────────────── */
async function loadMessages() {
  document.getElementById('chat-messages').innerHTML = '<div class="spinner" style="margin:16px auto;display:block"></div>';
  try {
    const data = await api('GET', `/projects/${st.project._id}/chat/messages`);
    const msgs = data.messages || data;
    const box  = document.getElementById('chat-messages');
    box.innerHTML = msgs.length ? msgs.map(m => msgHtml(m)).join('') : '<div style="color:#333;text-align:center;padding:20px;font-size:12px">Nessun messaggio ancora.</div>';
    box.scrollTop = box.scrollHeight;
  } catch (e) {
    toast('Errore chat: ' + e.message);
  }
}

function msgHtml(m) {
  // Il campo mittente può essere userId (schema DB) o senderId (eventi socket)
  const sender = m.userId || m.senderId;
  const isMine = sender?._id === st.user?._id || sender === st.user?._id;
  const name   = sender?.username || 'Utente';
  const time   = m.createdAt ? new Date(m.createdAt).toLocaleTimeString('it-IT', { hour:'2-digit', minute:'2-digit' }) : '';
  return `<div class="msg ${isMine ? 'mine' : ''}">
    <div class="avatar" style="width:24px;height:24px;font-size:9px">${name[0].toUpperCase()}</div>
    <div class="msg-bubble">
      <div class="msg-sender">${esc(name)}</div>
      <div class="msg-text">${esc(m.text)}</div>
      <div class="msg-time">${time}</div>
    </div>
  </div>`;
}

async function sendChatMessage() {
  const input = document.getElementById('chat-input');
  const text  = input.value.trim();
  if (!text) return;
  input.value = '';
  try {
    await api('POST', `/projects/${st.project._id}/chat/messages`, { text });
    // il messaggio arriva via socket (message:received)
  } catch (e) {
    toast('Errore invio: ' + e.message);
    input.value = text;
  }
}

/* ────────────────────────── SOCKET.IO ────────────────────────── */
function initSocket() {
  st.socket = io({ auth: { token: st.token } });

  st.socket.on('connect', () => {
    if (st.project) st.socket.emit('project:join', { projectId: st.project._id });
  });

  st.socket.on('message:received', (msg) => {
    const box = document.getElementById('chat-messages');
    if (!box) return;
    const empty = box.querySelector('div[style*="color:#333"]');
    if (empty) empty.remove();
    box.insertAdjacentHTML('beforeend', msgHtml(msg));
    box.scrollTop = box.scrollHeight;
    const sender = msg.userId || msg.senderId;
    const senderName = sender?.username || 'Qualcuno';
    if ((sender?._id || sender) !== st.user?._id) {
      toast(`💬 ${senderName}: ${msg.text.slice(0, 60)}`);
    }
  });

  st.socket.on('task:assigned', () => {
    loadNotifications();
    if (st.project) loadBoard();
  });

  ['task:created', 'task:updated', 'task:status_changed', 'task:deleted']
    .forEach(ev => st.socket.on(ev, () => { scheduleBoardRefresh(); if (st.detail.taskId) setTimeout(() => { if (currentTask()) renderDetail(); }, 700); }));
  ['comment:created', 'comment:deleted'].forEach(ev => st.socket.on(ev, payload => onCommentEvent(ev, payload)));

  st.socket.on('connect_error', () => {
    // silenzioso in demo
  });
}

/* ────────────────────────── DETTAGLIO TASK (Fase 2) ────────────────────────── */
const TAG_PRESETS = [
  { name: 'Bug', color: '#ef4444' },
  { name: 'Feature', color: '#22c55e' },
  { name: 'Design', color: '#a855f7' },
  { name: 'Docs', color: '#3b82f6' },
  { name: 'Urgente', color: '#f97316' },
];
const TAG_COLORS = ['#ef4444', '#f97316', '#f0a500', '#22c55e', '#14b8a6', '#3b82f6', '#a855f7', '#ec4899', '#6b7280'];

st.detail = { taskId: null, comments: [], tagColor: TAG_COLORS[5], confirmDelete: false };

/* Extra mostrati sulla card: tag, avanzamento checklist, commenti */
function taskCardExtra(t) {
  const tags = t.tags || [];
  const shown = tags.slice(0, 3).map(tg =>
    `<span class="tag-chip" style="${tagStyle(tg.color)}">${esc(tg.name)}</span>`).join('');
  const more = tags.length > 3 ? `<span class="tag-chip tag-more">+${tags.length - 3}</span>` : '';
  const list = t.checklist || [];
  const done = list.filter(i => i.done).length;
  const pct = list.length ? Math.round((done / list.length) * 100) : 0;
  const checklistHtml = list.length
    ? `<div class="card-progress" title="${done} di ${list.length} completati">
        <div class="card-progress-bar"><span style="width:${pct}%"></span></div>
        <span class="card-progress-label ${done === list.length ? 'complete' : ''}">☑ ${done}/${list.length}</span>
      </div>`
    : '';
  const comments = t.commentsCount ? `<span class="card-comments" title="${t.commentsCount} commenti">💬 ${t.commentsCount}</span>` : '';
  if (!tags.length && !checklistHtml && !comments) return '';
  return `<div class="card-extra">${tags.length ? `<div class="tag-row">${shown}${more}</div>` : ''}${checklistHtml}${comments ? `<div class="card-extra-row">${comments}</div>` : ''}</div>`;
}

function tagStyle(color) {
  const c = /^#[0-9a-fA-F]{6}$/.test(color || '') ? color : '#6b7280';
  return `background:${c}26;color:${c};border-color:${c}66`;
}

/* ── Apertura e chiusura ── */
async function openTaskDetail(id) {
  const t = findTask(id);
  if (!t) return;
  st.detail.taskId = String(id);
  st.detail.confirmDelete = false;
  document.getElementById('task-drawer').classList.remove('hidden');
  document.body.classList.add('drawer-open');

}

function closeTaskDetail() {
  st.detail.taskId = null;
  document.getElementById('task-drawer').classList.add('hidden');
  document.body.classList.remove('drawer-open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && st.detail.taskId) closeTaskDetail(); });

function currentTask() { return st.detail.taskId ? findTask(st.detail.taskId) : null; }

/* ── Rendering ── */
function renderDetail() {
  const t = currentTask();
  if (!t) { closeTaskDetail(); return; }
  document.getElementById('td-status').textContent = labelFor(t.status);
  document.getElementById('td-status').className = `badge badge-${t.status === 'done' ? 'done' : t.status === 'in_progress' ? 'progress' : 'todo'}`;
  document.getElementById('td-title').value = t.title || '';
  document.getElementById('td-desc').value = t.description || '';
  document.getElementById('td-priority').value = t.priority || 'medium';
  document.getElementById('td-deadline').value = t.deadline ? new Date(t.deadline).toISOString().slice(0, 10) : '';
  const sel = document.getElementById('td-assignee');
  const people = [...projectPeople()].sort((a, b) => a[1].localeCompare(b[1]));
  sel.innerHTML = '<option value="">Nessuno</option>' + people.map(([pid, name]) => `<option value="${esc(pid)}">${esc(name)}</option>`).join('');
  sel.value = String(userIdOf(t.assigneeId) || '');
  const meta = [];
  if (t.createdBy && t.createdBy.username) meta.push(`Creato da ${esc(t.createdBy.username)}`);
  if (t.createdAt) meta.push(new Date(t.createdAt).toLocaleDateString('it-IT', { day: '2-digit', month: 'long', year: 'numeric' }));
  document.getElementById('td-meta').innerHTML = meta.join(' · ');
  clearFieldErrors(document.getElementById('td-form'));
  document.getElementById('td-delete').textContent = 'Elimina task';
  st.detail.confirmDelete = false;
  renderTags();
  renderChecklist();
}

function renderTags() {
  const t = currentTask();
  const tags = t.tags || [];
  document.getElementById('td-tags').innerHTML = tags.length
    ? tags.map((tg, i) => `<span class="tag-chip tag-chip-lg" style="${tagStyle(tg.color)}">${esc(tg.name)}<button class="tag-x" title="Rimuovi" onclick="removeTag(${i})">×</button></span>`).join('')
    : '<span class="muted-note">Nessuna etichetta</span>';
  const names = tags.map(x => x.name.toLowerCase());
  document.getElementById('td-tag-presets').innerHTML = TAG_PRESETS
    .filter(p => !names.includes(p.name.toLowerCase()))
    .map(p => `<button class="tag-chip tag-preset" style="${tagStyle(p.color)}" onclick="addTag('${p.name}','${p.color}')">+ ${p.name}</button>`).join('');
  document.getElementById('td-tag-colors').innerHTML = TAG_COLORS.map(c =>
    `<button class="color-dot ${c === st.detail.tagColor ? 'active' : ''}" style="background:${c}" title="${c}" onclick="pickTagColor('${c}')"></button>`).join('') +
    `<label class="color-custom" title="Colore personalizzato"><input type="color" value="${st.detail.tagColor}" oninput="pickTagColor(this.value)" />🎨</label>`;
}

function renderChecklist() {
  const t = currentTask();
  const list = t.checklist || [];
  const done = list.filter(i => i.done).length;
  const pct = list.length ? Math.round((done / list.length) * 100) : 0;
  document.getElementById('td-check-label').textContent = list.length ? `${done}/${list.length} completati` : 'Nessuno step';
  document.getElementById('td-check-bar').style.width = pct + '%';
  document.getElementById('td-check-bar').classList.toggle('complete', list.length > 0 && done === list.length);
  document.getElementById('td-checklist').innerHTML = list.map((item, i) => `
    <li class="check-item ${item.done ? 'done' : ''}">
      <label><input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleCheckItem(${i})" /><span>${esc(item.text)}</span></label>
      <button class="icon-btn" title="Elimina step" onclick="removeCheckItem(${i})">×</button>
    </li>`).join('');
}

/* ── Salvataggio ── */
async function saveTaskPatch(patch, { silent = false } = {}) {
  const t = currentTask();
  if (!t) return false;
  try {
    const data = await api('PUT', `/projects/${st.project._id}/tasks/${t._id}`, patch);
    const updated = data.task || {};
    const keep = { commentsCount: t.commentsCount, createdBy: t.createdBy };
    Object.assign(t, updated, keep);
    renderBoard();
    if (!silent) toast('Task aggiornato');
    return true;
  } catch (e) {
    toast('Salvataggio non riuscito: ' + translateError(e.message));
    return false;
  }
}

function checklistPayload(list) {
  return list.map(i => (i._id ? { _id: i._id, text: i.text, done: !!i.done } : { text: i.text, done: !!i.done }));
}

async function saveDetails() {
  const form = document.getElementById('td-form');
  clearFieldErrors(form);
  const title = document.getElementById('td-title').value.trim();
  const description = document.getElementById('td-desc').value.trim();
  const deadline = document.getElementById('td-deadline').value;
  let ok = true;
  if (!title) ok = fieldError('td-title', 'Il titolo è obbligatorio');
  else if (title.length < 3) ok = fieldError('td-title', 'Usa almeno 3 caratteri');
  else if (title.length > 150) ok = fieldError('td-title', 'Massimo 150 caratteri');
  if (description.length > 2000) ok = fieldError('td-desc', 'Massimo 2000 caratteri');
  if (!ok) return;
  const patch = {
    title,
    description,
    priority: document.getElementById('td-priority').value,
    assigneeId: document.getElementById('td-assignee').value || null,
  };
  if (deadline) patch.deadline = deadline;
  const btn = document.getElementById('td-save');
  btn.disabled = true;
  if (await saveTaskPatch(patch)) renderDetail();
  btn.disabled = false;
}

async function deleteTask() {
  const btn = document.getElementById('td-delete');
  if (!st.detail.confirmDelete) {
    st.detail.confirmDelete = true;
    btn.textContent = 'Conferma eliminazione';
    setTimeout(() => {
      if (st.detail.confirmDelete) { st.detail.confirmDelete = false; btn.textContent = 'Elimina task'; }
    }, 4000);
    return;
  }
  const t = currentTask();
  try {
    await api('DELETE', `/projects/${st.project._id}/tasks/${t._id}`);
    st.board[t.status] = st.board[t.status].filter(x => x !== t);
    closeTaskDetail();
    renderBoard();
    toast('Task eliminato');
  } catch (e) {
    toast('Eliminazione non riuscita: ' + e.message);
  }
}

/* ── Tag ── */
function pickTagColor(c) {
  st.detail.tagColor = c;
  renderTags();
}

async function addTag(name, color) {
  const t = currentTask();
  const input = document.getElementById('td-tag-name');
  const err = document.getElementById('td-tag-error');
  err.textContent = '';
  const tagName = (name || input.value).trim();
  const tags = t.tags || [];
  if (!tagName) { err.textContent = 'Scrivi il nome dell\'etichetta'; return; }
  if (tagName.length > 30) { err.textContent = 'Massimo 30 caratteri'; return; }
  if (tags.some(x => x.name.toLowerCase() === tagName.toLowerCase())) { err.textContent = 'Etichetta già presente'; return; }
  if (tags.length >= 10) { err.textContent = 'Massimo 10 etichette per task'; return; }
  const next = [...tags.map(x => ({ name: x.name, color: x.color })), { name: tagName, color: color || st.detail.tagColor }];
  if (await saveTaskPatch({ tags: next }, { silent: true })) {
    input.value = '';
    renderTags();
  }
}

async function removeTag(i) {
  const t = currentTask();
  const next = (t.tags || []).filter((_, k) => k !== i).map(x => ({ name: x.name, color: x.color }));
  if (await saveTaskPatch({ tags: next }, { silent: true })) renderTags();
}

/* ── Checklist ── */
async function addCheckItem() {
  const input = document.getElementById('td-check-new');
  const text = input.value.trim();
  const t = currentTask();
  const list = t.checklist || [];
  if (!text) return;
  if (text.length > 200) { toast('Uno step può avere al massimo 200 caratteri'); return; }
  if (list.length >= 50) { toast('Massimo 50 step per task'); return; }
  input.value = '';
  if (await saveTaskPatch({ checklist: checklistPayload([...list, { text, done: false }]) }, { silent: true })) renderChecklist();
  input.focus();
}

async function toggleCheckItem(i) {
  const t = currentTask();
  const list = (t.checklist || []).map((x, k) => (k === i ? { ...x, done: !x.done } : x));
  t.checklist = list; // aggiornamento ottimistico
  renderChecklist();
  renderBoard();
  if (!(await saveTaskPatch({ checklist: checklistPayload(list) }, { silent: true }))) loadBoard({ silent: true });
  else renderChecklist();
}

async function removeCheckItem(i) {
  const t = currentTask();
  const list = (t.checklist || []).filter((_, k) => k !== i);
  if (await saveTaskPatch({ checklist: checklistPayload(list) }, { silent: true })) renderChecklist();
}

/* ── Commenti ── */
async function loadComments() {
  const t = currentTask();
  const box = document.getElementById('td-comments');
  box.innerHTML = '<div class="spinner" style="margin:12px auto;display:block"></div>';
  try {
    const data = await api('GET', `/projects/${st.project._id}/tasks/${t._id}/comments`);
    st.detail.comments = data.comments || [];
    renderComments();

    box.innerHTML = `<div class="muted-note">Commenti non disponibili: ${esc(e.message)}</div>`;
  }
}

function renderComments() {
  const box = document.getElementById('td-comments');
  const list = st.detail.comments;
  document.getElementById('td-comments-count').textContent = list.length ? `(${list.length})` : '';
  if (!list.length) { box.innerHTML = '<div class="muted-note">Ancora nessun commento. Scrivi il primo!</div>'; return; }
  box.innerHTML = list.map(c => {
    const author = c.userId || {};
    const name = author.username || 'Utente';
    const mine = String(author._id || author) === String(st.user && st.user._id);
    const canDelete = mine || (st.user && st.user.role === 'admin');
    const when = c.createdAt ? new Date(c.createdAt).toLocaleString('it-IT', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
    return `<div class="comment ${mine ? 'mine' : ''}">
      <div class="avatar task-avatar" style="background:${avatarColor(name)}">${esc(name[0].toUpperCase())}</div>
      <div class="comment-body">
        <div class="comment-head"><strong>${esc(name)}</strong><span>${when}</span>
          ${canDelete ? `<button class="icon-btn" title="Elimina commento" onclick="deleteComment('${esc(c._id)}')">×</button>` : ''}</div>
        <div class="comment-text">${esc(c.text)}</div>
      </div>
    </div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

async function sendComment() {
  const input = document.getElementById('td-comment-input');
  const err = document.getElementById('td-comment-error');
  const text = input.value.trim();
  err.textContent = '';
  if (!text) { err.textContent = 'Il commento è vuoto'; return; }
  if (text.length > 1000) { err.textContent = 'Massimo 1000 caratteri'; return; }
  const t = currentTask();
  const btn = document.getElementById('td-comment-send');
  btn.disabled = true;
  try {
    const data = await api('POST', `/projects/${st.project._id}/tasks/${t._id}/comments`, { text });
    if (data.comment && !st.detail.comments.some(c => c._id === data.comment._id)) st.detail.comments.push(data.comment);
    t.commentsCount = st.detail.comments.length;
    input.value = '';
    renderComments();
    renderBoard();
  } catch (e) {
    err.textContent = translateError(e.message);
  } finally {
    btn.disabled = false;
  }
}

async function deleteComment(id) {
  const t = currentTask();
  try {
    await api('DELETE', `/projects/${st.project._id}/tasks/${t._id}/comments/${id}`);
    st.detail.comments = st.detail.comments.filter(c => c._id !== id);
    t.commentsCount = st.detail.comments.length;
    renderComments();
    renderBoard();
  } catch (e) {
    toast('Impossibile eliminare: ' + e.message);
  }
}

/* Commenti in tempo reale da altri membri */
function onCommentEvent(ev, payload) {
  scheduleBoardRefresh();
  if (!payload || String(payload.taskId) !== st.detail.taskId) return;
  if (ev === 'comment:created' && payload.comment && !st.detail.comments.some(c => c._id === payload.comment._id)) {
    st.detail.comments.push(payload.comment);
  }
  if (ev === 'comment:deleted') st.detail.comments = st.detail.comments.filter(c => c._id !== payload.commentId);
  renderComments();
}

/* ────────────────────────── VALIDAZIONE FORM ────────────────────────── */
function clearFieldErrors(root) {
  root.querySelectorAll('.has-error').forEach(el => el.classList.remove('has-error'));
  root.querySelectorAll('.field-msg').forEach(el => { el.textContent = ''; });
  root.querySelectorAll('.error-msg').forEach(el => { el.textContent = ''; });
}

function fieldError(inputId, message) {
  const input = document.getElementById(inputId);
  const group = input.closest('.form-group');
  group.classList.add('has-error');
  let msg = group.querySelector('.field-msg');
  if (!msg) {
    msg = document.createElement('div');
    msg.className = 'field-msg';
    group.appendChild(msg);
  }
  msg.textContent = message;
  return false;
}

/* Collega il messaggio del server al campo giusto quando possibile */
function showServerError(e, map, fallbackId) {
  const text = e.message || 'Errore';
  for (const [key, inputId] of Object.entries(map)) {
    if (text.toLowerCase().includes(key)) return fieldError(inputId, translateError(text));
  }
  document.getElementById(fallbackId).textContent = translateError(text);
}

function translateError(text) {
  return text
    .replace(/title is required|title cannot be empty/i, 'Il titolo è obbligatorio')
    .replace(/title must be at most (\d+) characters/i, 'Il titolo può avere al massimo $1 caratteri')
    .replace(/description must be at most (\d+) characters/i, 'La descrizione può avere al massimo $1 caratteri')
    .replace(/Invalid priority/i, 'Priorità non valida')
    .replace(/Invalid category/i, 'Categoria non valida')
    .replace(/deadline must be a date YYYY-MM-DD/i, 'Data di scadenza non valida');
}

function validateProjectForm() {
  const modal = document.getElementById('modal-project');
  clearFieldErrors(modal);
  let ok = true;
  const title = document.getElementById('np-title').value.trim();
  const desc = document.getElementById('np-desc').value.trim();
  if (!title) ok = fieldError('np-title', 'Il titolo è obbligatorio');
  else if (title.length < 3) ok = fieldError('np-title', 'Usa almeno 3 caratteri');
  else if (title.length > 100) ok = fieldError('np-title', 'Massimo 100 caratteri');
  if (desc.length > 2000) ok = fieldError('np-desc', 'Massimo 2000 caratteri');
  if (!document.getElementById('np-category').value) ok = fieldError('np-category', 'Scegli una categoria');
  return ok;
}

function validateTaskForm() {
  const modal = document.getElementById('modal-task');
  clearFieldErrors(modal);
  let ok = true;
  const title = document.getElementById('nt-title').value.trim();
  const desc = document.getElementById('nt-desc').value.trim();
  const deadline = document.getElementById('nt-deadline').value;
  if (!title) ok = fieldError('nt-title', 'Il titolo è obbligatorio');
  else if (title.length < 3) ok = fieldError('nt-title', 'Usa almeno 3 caratteri');
  else if (title.length > 150) ok = fieldError('nt-title', 'Massimo 150 caratteri');
  if (desc.length > 2000) ok = fieldError('nt-desc', 'Massimo 2000 caratteri');
  if (!document.getElementById('nt-priority').value) ok = fieldError('nt-priority', 'Scegli una priorità');
  if (deadline) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(deadline)) ok = fieldError('nt-deadline', 'Data non valida');
    else if (new Date(deadline + 'T00:00:00') < today) ok = fieldError('nt-deadline', 'La scadenza non può essere nel passato');
  }
  return ok;
}

async function createProject() {
  if (!validateProjectForm()) return;
  const body = {
    title: document.getElementById('np-title').value.trim(),
    category: document.getElementById('np-category').value,
    visibility: document.getElementById('np-visibility').value,
  };
  const description = document.getElementById('np-desc').value.trim();
  if (description) body.description = description;
  const btn = document.getElementById('np-save');
  btn.disabled = true;
  try {
    await api('POST', '/projects', body);
    closeModal();
    toast('Progetto creato');
    goToDashboard();
  } catch (e) {
    showServerError(e, { title: 'np-title', description: 'np-desc', category: 'np-category' }, 'np-error');
  } finally {
    btn.disabled = false;
  }
}

async function createTask() {
  if (!validateTaskForm()) return;
  const body = {
    title: document.getElementById('nt-title').value.trim(),
    priority: document.getElementById('nt-priority').value,
  };
  const description = document.getElementById('nt-desc').value.trim();
  const deadline = document.getElementById('nt-deadline').value;
  const assigneeId = document.getElementById('nt-assignee').value;
  if (description) body.description = description;
  if (deadline) body.deadline = deadline;
  if (assigneeId) body.assigneeId = assigneeId;
  const btn = document.getElementById('nt-save');
  btn.disabled = true;
  try {
    await api('POST', `/projects/${st.project._id}/tasks`, body);
    closeModal();
    toast('Task creato');
    loadBoard({ silent: true });
  } catch (e) {
    showServerError(e, { title: 'nt-title', description: 'nt-desc', priority: 'nt-priority', deadline: 'nt-deadline', assignee: 'nt-assignee' }, 'nt-error');
  } finally {
    btn.disabled = false;
  }
}

/* Validazione mentre si scrive: l'errore sparisce appena il campo è corretto */
document.addEventListener('input', e => {
  const group = e.target.closest && e.target.closest('.modal .form-group.has-error');
  if (group) {
    group.classList.remove('has-error');
    const msg = group.querySelector('.field-msg');
    if (msg) msg.textContent = '';
  }
});

/* ────────────────────────── NOTIFICHE ────────────────────────── */
const NOTIF_TEXT = {
  task_assigned: 'Ti è stato assegnato un task',
  task_status_changed: 'Lo stato di un task è cambiato',
  member_joined: 'Un nuovo membro è entrato nel progetto',
  project_reported: 'Un progetto è stato segnalato',
  task_commented: 'Nuovo commento su un tuo task',
};

async function loadNotifications() {
  if (!st.token) return;
  try {
    const data = await api('GET', '/notifications');
    const list = data.notifications || [];
    const unread = data.unreadCount ?? list.filter(n => !n.read).length;
    const badge = document.getElementById('bell-count');
    badge.textContent = unread > 99 ? '99+' : unread;
    badge.classList.toggle('hidden', !unread);
    document.getElementById('notif-list').innerHTML = list.length
      ? list.map(n => `<div class="notif-item ${n.read ? '' : 'unread'}" onclick="markRead('${esc(n._id)}')">
          ${esc(n.message || NOTIF_TEXT[n.type] || n.type)}
          <small>${n.createdAt ? new Date(n.createdAt).toLocaleString('it-IT') : ''}</small>
        </div>`).join('')
      : '<div class="notif-empty">Nessuna notifica</div>';
  } catch (_) { /* le notifiche non devono bloccare l'interfaccia */ }
}

function toggleNotifications() {
  const panel = document.getElementById('notif-panel');
  panel.classList.toggle('hidden');
  if (!panel.classList.contains('hidden')) loadNotifications();
}

async function markRead(id) {
  try { await api('PATCH', `/notifications/${id}/read`); loadNotifications(); } catch (e) { toast(e.message); }
}

async function markAllRead() {
  try { await api('PATCH', '/notifications/read-all'); loadNotifications(); } catch (e) { toast(e.message); }
}

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
